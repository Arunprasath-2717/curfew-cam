version: '3.8'

services:
  db:
    image: postgres:15-alpine
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      - POSTGRES_DB=curfewcam
      - POSTGRES_USER=curfewcam
      - POSTGRES_PASSWORD=secretpassword
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    ports:
      - "6380:6379"

  web:
    build: .
    command: /entrypoint.sh
    volumes:
      - static_volume:/app/staticfiles
      - media_volume:/app/media
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=src.config.settings.production
      - SECRET_KEY=your-super-secret-production-key
      - SSL_REDIRECT=False
      - ALLOWED_HOSTS=localhost,127.0.0.1,web,10.0.2.2
      - POSTGRES_DB=curfewcam
      - POSTGRES_USER=curfewcam
      - POSTGRES_PASSWORD=secretpassword
      - DATABASE_URL=postgres://curfewcam:secretpassword@db:5432/curfewcam
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  celery:
    build: .
    command: ./celery-entrypoint.sh
    volumes:
      - media_volume:/app/media
    environment:
      - DEBUG=0
      - DJANGO_SETTINGS_MODULE=src.config.settings.production
      - SECRET_KEY=your-super-secret-production-key
      - POSTGRES_DB=curfewcam
      - POSTGRES_USER=curfewcam
      - POSTGRES_PASSWORD=secretpassword
      - DATABASE_URL=postgres://curfewcam:secretpassword@db:5432/curfewcam
      - POSTGRES_HOST=db
      - POSTGRES_PORT=5432
      - REDIS_URL=redis://redis:6379/1
      - CELERY_BROKER_URL=redis://redis:6379/0
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    depends_on:
      - db
      - redis
      - web

volumes:
  postgres_data:
  static_volume:
  media_volume:
